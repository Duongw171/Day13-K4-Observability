alerts:
  - name: high_latency_p95
    severity: warning
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: oncall-ai-team
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2% for 2m
    type: symptom-based
    owner: oncall-ai-team
    runbook: docs/alerts.md#alert-2
  - name: quality_score_drop
    severity: warning
    condition: quality_score_avg < 0.75 for 10m
    type: symptom-based
    owner: oncall-ai-team
    runbook: docs/alerts.md#alert-3
