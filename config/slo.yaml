service: day13-observability-lab
window: 28d
slis:
  latency_p95_ms:
    objective: 3000
    target: 99.5
    note: P95 latency dưới 3000ms cho ít nhất 99.5% tổng số requests
  error_rate_pct:
    objective: 2
    target: 99.0
    note: Tỉ lệ lỗi HTTP 5xx / Exception dưới 2% trên tổng requests
  daily_cost_usd:
    objective: 2.5
    target: 100.0
    note: Chi phí token trong ngày không vượt quá 2.5 USD
  quality_score_avg:
    objective: 0.75
    target: 95.0
    note: Điểm chất lượng trung bình (quality proxy) đạt tối thiểu 0.75 cho 95% request
